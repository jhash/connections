name: Build and push images

on:
  push:
    branches: [main]
    paths: [Dockerfile, deploy/Dockerfile, Cargo.toml, Cargo.lock, crates/**, migrations/**, scripts/**, archive.json, .github/workflows/build-images.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: connections-amd64, buildkit: tcp://buildkitd.buildkit.svc.cluster.local:1234 }
          - { arch: arm64, runner: connections-arm64, buildkit: tcp://buildkitd-arm64.buildkit.svc.cluster.local:1234 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install buildctl
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/moby/buildkit/releases/download/v0.33.0/buildkit-v0.33.0.linux-${{ matrix.arch }}.tar.gz | tar -xz -C /tmp bin/buildctl
          install -m 0755 /tmp/bin/buildctl "$RUNNER_TEMP/buildctl"
      - name: Registry auth
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          auth=$(printf '%s:%s' '${{ github.actor }}' "$GH_TOKEN" | base64 | tr -d '\n')
          mkdir -p "$RUNNER_TEMP/docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "$RUNNER_TEMP/docker/config.json"
      - name: Native builds and pushes
        env: { DOCKER_CONFIG: ${{ runner.temp }}/docker }
        run: |
          set -euo pipefail
          for spec in 'connections:Dockerfile' 'connections-web:deploy/Dockerfile'; do
            name=${spec%%:*}; file=${spec#*:}; image="ghcr.io/${{ github.repository_owner }}/$name"
            "$RUNNER_TEMP/buildctl" --addr "${{ matrix.buildkit }}" build --frontend dockerfile.v0 --local context=. --local dockerfile=. --opt filename="$file" \
              --output "type=image,name=${image}:${GITHUB_SHA}-${{ matrix.arch }},push=true" \
              --export-cache "type=registry,ref=${image}:buildcache-${{ matrix.arch }},mode=max" \
              --import-cache "type=registry,ref=${image}:buildcache-${{ matrix.arch }}"
          done
  manifest:
    needs: build
    runs-on: connections-amd64
    steps:
      - name: Install crane
        run: curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP" crane
      - name: Publish manifests
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          set -euo pipefail
          auth=$(printf '%s:%s' '${{ github.actor }}' "$GH_TOKEN" | base64 | tr -d '\n')
          printf '%s' "$auth" | "$RUNNER_TEMP/crane" auth login ghcr.io -u '${{ github.actor }}' --password-stdin
          for name in connections connections-web; do
            image="ghcr.io/${{ github.repository_owner }}/$name"
            "$RUNNER_TEMP/crane" index append -t "${image}:${GITHUB_SHA}" "${image}:${GITHUB_SHA}-amd64" "${image}:${GITHUB_SHA}-arm64"
            "$RUNNER_TEMP/crane" tag "${image}:${GITHUB_SHA}" latest
          done
